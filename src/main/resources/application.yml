spring:
  main:
    web-application-type: servlet
  jackson:
    deserialization:
      # Unknown request fields are a 400 (see ApiExceptionHandler), not silently ignored.
      fail-on-unknown-properties: true
  ai:
    mcp:
      server:
        enabled: false
        name: sparsesim
        version: ${APP_VERSION:0.0.1-SNAPSHOT}
        type: SYNC
        protocol: SSE
        sse-message-endpoint: /mcp/message
        annotation-scanner:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Default index directory (can be overridden via environment variable)
indexdir: ${INDEX_DIR:/app/index}
# Read the whole index into memory at startup; by default pages are read on demand.
preload: ${INDEX_PRELOAD:false}

---
spring:
  config:
    activate:
      on-profile: mcp
  ai:
    mcp:
      server:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: indexer
  main:
    web-application-type: none

# CLI profile index directory
indexdir: ${INDEX_DIR:./index}
